[project]
name = "diplomado-ia-llms"
version = "2026.2"
description = "Diplomado IA UNAM · Módulo 5 · LLMs — notebooks, scripts y notas"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "F401", "I001"]
"parte-1-motor/**" = ["UP", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
