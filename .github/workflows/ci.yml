name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: python parte-3-oficio/don_titular.py parte-3-oficio/ejemplo-briefing.jsonl
      - name: notebooks sin torch (04, 06, 08)
        run: python scripts/run_notebooks.py
